    value: AIzaSyBGaDhXUnmMfYsjxK9Jh5Tk3vGn78mum3U
  - variable: NEXT_PUBLIC_GEMINI_API_KEY
    value: AIzaSyCqmTgivoGfkQ7NihOXZ-kQveAx2udW5JA
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
