# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  maxInstances: 4
  minInstances: 0
  cpu: 1
  memoryMiB: 512
  concurrency: 80

# ─── Environment Variables ────────────────────────────────────────────────────
# NEXT_PUBLIC_* vars are compiled into the client-side JS bundle at build time
# and are PUBLIC by design. They are NOT secrets.
#
# Firebase API keys are safe to expose — security is enforced by:
#   1. Firestore Security Rules (firestore.rules)
#   2. Firebase Auth domain restrictions
#   3. API key restrictions in Google Cloud Console
#
# For local development, copy .env.local.example → .env.local
# ──────────────────────────────────────────────────────────────────────────────
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBGaDhXUnmMfYsjxK9Jh5Tk3vGn78mum3U
