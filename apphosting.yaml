
# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  maxInstances: 4
  minInstances: 0
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBGaDhXUnmMfYsjxK9Jh5Tk3vGn78mum3U
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: creeda-va.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: creeda-va
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: creeda-va.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "53722795216"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:53722795216:web:18065a250c22647774a2d5"
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-5DC2T0DSDW
  # Mirrors FIREBASE_MEASUREMENT_ID — used by the GA4 <Script> tag in marketing layout
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-5DC2T0DSDW
  # Cloud Functions origin used by Next.js rewrites for same-origin client calls
  # (browser requests stay on https://creedava.com)
  - variable: NEXT_PUBLIC_FIREBASE_FUNCTIONS_URL
    value: https://us-east4-creeda-va.cloudfunctions.net

  # Firebase App Check (reCAPTCHA Enterprise)
  # Protects Firestore / Auth / Cloud Functions from unauthorized access.
  - variable: NEXT_PUBLIC_ENABLE_APP_CHECK
    value: "true"
  - variable: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY
    value: 6LdnGGwsAAAAALSLfGUNF4tob4xnSYVkktsVAQrB

  # Optional: Firebase Cloud Messaging (push notifications)
  # Uncomment and set after generating a VAPID key in Firebase Console
  # → Project Settings → Cloud Messaging → Web Push certificates.
  # - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
  #   value: YOUR_VAPID_KEY

# Build output.
#
# App Hosting prunes the deployed bundle to what the framework adapter declares
# it needs. Measured 2026-11-11 against production: every file in `public/`
# returned 404 (`/creedava-logo.svg`, `/logo.webp`, `/world-atlas-110m.json`,
# `/firebase-messaging-sw.js`) on both the custom domain and the backend URL,
# while `app/` routes (`/robots.txt`, `/favicon.ico`, `/_next/static/**`) served
# normally. That is the adapter bundle dropping the directory, not a caching or
# domain problem.
#
# `include: [.]` is the documented "keep everything" setting, so the directory
# survives the bundle step. It costs image size; correctness wins while
# `/creedava-logo.svg` is referenced by the footer, the sign-in page, JSON-LD
# and the share metadata.
outputFiles:
  serverApp:
    include: ["."]

# Cache headers
# Static Next.js assets have content hashes → cache forever (immutable)
# Prerendered marketing pages → CDN cache 1 h, stale-while-revalidate 24 h
# Images / fonts → CDN cache 7 days
headers:
  - glob: "/_next/static/**"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"

  - glob: "/**.webp"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=604800, s-maxage=604800, stale-while-revalidate=86400"

  - glob: "/**.png"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=604800, s-maxage=604800, stale-while-revalidate=86400"

  - glob: "/about"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

  - glob: "/contact"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

  - glob: "/faq"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

  - glob: "/forum"
