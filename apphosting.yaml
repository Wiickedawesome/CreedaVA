
# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  maxInstances: 4
  minInstances: 0
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBGaDhXUnmMfYsjxK9Jh5Tk3vGn78mum3U
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: creeda-va.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: creeda-va
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: creeda-va.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "53722795216"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:53722795216:web:18065a250c22647774a2d5"
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-GSYB90RLF2
  # Mirrors FIREBASE_MEASUREMENT_ID — used by the GA4 <Script> tag in marketing layout
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-GSYB90RLF2
  # Base URL for Cloud Functions HTTP endpoints (contact form, webhooks)
  - variable: NEXT_PUBLIC_FIREBASE_FUNCTIONS_URL
    value: https://us-east4-creeda-va.cloudfunctions.net

  # Optional: Firebase App Check (reCAPTCHA Enterprise)
  # Uncomment and set after registering the site in Firebase Console → App Check.
  # Protects Firestore / Cloud Functions from unauthorized access.
  # - variable: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY
  #   value: YOUR_RECAPTCHA_ENTERPRISE_SITE_KEY

  # Optional: Firebase Cloud Messaging (push notifications)
  # Uncomment and set after generating a VAPID key in Firebase Console
  # → Project Settings → Cloud Messaging → Web Push certificates.
  # - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
  #   value: YOUR_VAPID_KEY
