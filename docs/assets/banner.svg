  <rect x="280" y="148" width="64" height="22" rx="11" fill="white" fill-opacity="0.12"/>
  <text x="312" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" font-size="11" fill="white">Firebase</text>
  <rect x="352" y="148" width="82" height="22" rx="11" fill="white" fill-opacity="0.12"/>
  <text x="393" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="500" font-size="11" fill="white">Tailwind v4</text>
  <rect x="442" y="148" width="78" height="22" rx="11" fill="white" fill-opacity="0.12"/>
