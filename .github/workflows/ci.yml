name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Both jobs only check out the repo and run npm, so
# nothing here needs a write scope — declaring it keeps a compromised or
# malicious step from gaining one (actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  app:
    name: App (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check + build
        run: npm run build
        env:
          # Surface real build/type errors in CI even when secrets are missing.
          NEXT_TELEMETRY_DISABLED: "1"

  functions:
    name: Functions (build / tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Type-check + build
        working-directory: functions
        run: npm run build

      - name: Unit tests
        working-directory: functions
        run: npm test
