name: Scheduled Deployment Monitor

on:
  schedule:
    # every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run health check (continue on error to handle reporting)
        id: run-verify
        continue-on-error: true
        run: |
          set +e
          ./scripts/verify-deploy.sh --health https://creedava.com > verification.out 2>&1
          status=$?
          echo "verify_status=$status" >> $GITHUB_OUTPUT
          echo "--- verification output start ---"
          cat verification.out
          echo "--- verification output end ---"

      - name: Report failure
        if: steps.run-verify.outputs.verify_status != '0'
        uses: actions/github-script@v7
        env:
          VERIFY_STATUS: ${{ steps.run-verify.outputs.verify_status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status = parseInt(process.env.VERIFY_STATUS || '0');
            const fs = require('fs');
            let body = 'no output';
            try { body = fs.readFileSync('verification.out', 'utf8') } catch (e) { /* ignore */ }
            const title = `Deployment monitor alert: verification failed (code ${status})`;

            // Try to create/comment on an issue; skip gracefully if Issues is disabled
            try {
              const issues = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open'});
              const exists = issues.data.find(i => i.title && i.title.startsWith('Deployment monitor alert: verification failed'));
              if (exists) {
                await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: exists.number, body: `Verification failed again (code ${status}).\n\n\`verification.out\`:\n\n${body.slice(0, 12000)}`});
                core.info('Posted comment to existing issue #' + exists.number);
              } else {
                const created = await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body: `Automated verification failed with exit code ${status}.\n\nVerification output:\n\n${body.slice(0, 60000)}`});
                core.info('Created issue #' + created.data.number);
              }
            } catch (err) {
              core.warning('Could not create issue (Issues may be disabled): ' + err.message);
            }

            // Always fail the workflow so it shows red in Actions
            core.setFailed(`Verification failed with exit code ${status}`);


