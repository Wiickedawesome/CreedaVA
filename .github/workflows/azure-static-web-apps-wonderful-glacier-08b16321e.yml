name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string

      - name: Lint vite config (no unsafe terser flags)
        run: |
          set -euo pipefail
          if grep -n "unsafe_arrows\|unsafe_methods\|toplevel" vite.config.ts; then
            echo "ERROR: Found unsafe terser options in vite.config.ts; remove them before deploying."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build site (Vite)
        run: npm run build

      - name: Verify build output (local)
        run: |
          chmod +x ./scripts/verify-deploy.sh
          ./scripts/verify-deploy.sh --local

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: https://creedava-api-ecbhhrf5dpewfph3.westus2-01.azurewebsites.net/api
          VITE_APP_URL: https://www.creedava.com
          VITE_ENABLE_GOOGLE_LOGIN: "true"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_SEARCH_CONSOLE_CLIENT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GLACIER_08B16321E }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # No API - deployed separately
          output_location: "dist" # Built app content directory (Vite builds to dist/)
          skip_api_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

      - name: Post-deploy verification (production)
        if: success()
        run: |
          chmod +x ./scripts/verify-deploy.sh
          ./scripts/verify-deploy.sh --remote https://www.creedava.com


  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions: {}
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          app_location: "."
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GLACIER_08B16321E }}
          action: "close"
