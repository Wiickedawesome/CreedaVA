name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: https://creedava-api-ecbhhrf5dpewfph3.westus2-01.azurewebsites.net/api
          VITE_APP_URL: https://www.creedava.com
          VITE_ENABLE_GOOGLE_LOGIN: "true"
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_SEARCH_CONSOLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_SEARCH_CONSOLE_CLIENT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GLACIER_08B16321E }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # No API - deployed separately
          output_location: "dist" # Built app content directory (Vite builds to dist/)
          skip_api_build: false
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

      - name: Post-deploy verification (preview/production)
        if: success()
        run: |
          chmod +x ./scripts/verify-deploy.sh
          # Try to obtain preview URL from action outputs, fall back to production
          PREVIEW_URL="${{ steps.builddeploy.outputs.deployment_url }}"
          PREVIEW_URL_FALLBACK="${{ steps.builddeploy.outputs.deployment_uri }}"
          if [ -n "$PREVIEW_URL" ]; then
            echo "Using preview URL: $PREVIEW_URL"
            ./scripts/verify-deploy.sh --remote "$PREVIEW_URL"
          elif [ -n "$PREVIEW_URL_FALLBACK" ]; then
            echo "Using preview URL fallback: $PREVIEW_URL_FALLBACK"
            ./scripts/verify-deploy.sh --remote "$PREVIEW_URL_FALLBACK"
          else
            echo "No preview URL available from action outputs; running production verification"
            ./scripts/verify-deploy.sh --remote https://www.creedava.com
          fi

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions: {}
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          app_location: "."
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GLACIER_08B16321E }}
          action: "close"
